<!DOCTYPE html>
<html lang="or" data-theme="amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Utkal.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="ମୁଖ୍ୟ ବିଭାଗ">
      <div class="brand" title="Utkal.ai">ଉ</div>
      <button type="button" data-screen="chat" class="active" aria-label="Chat">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg>
        ଚାଟ୍
      </button>
      <button type="button" data-screen="voice" aria-label="Voice">
        <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
        ଭଏସ୍
      </button>
      <button type="button" data-screen="khata" aria-label="Khata">
        <svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v16l-4-2-4 2-4-2-4 2V5a2 2 0 0 1 2-2z"/></svg>
        ଖାତା
      </button>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="titles">
          <h1>Utkal.ai</h1>
          <p>ଓଡ଼ିଆ ଚାଟ୍, ଭଏସ୍ ଓ ଦୋକାନ ଖାତା</p>
        </div>
        <div class="tools">
          <span class="status" id="connStatus"><span class="dot" id="connDot"></span><span id="connText">ଯାଞ୍ଚ ହେଉଛି</span></span>
          <div class="seg" role="group" aria-label="ଉତ୍ତର ଭାଷା">
            <button type="button" id="langOr" class="active">ଓଡ଼ିଆ</button>
            <button type="button" id="langEn">English</button>
          </div>
          <button type="button" class="icon-btn" id="fontDown" title="ଅକ୍ଷର ଛୋଟ">A−</button>
          <button type="button" class="icon-btn" id="fontUp" title="ଅକ୍ଷର ବଡ଼">A+</button>
          <div class="menu" id="themeMenu">
            <button type="button" class="ghost" id="themeBtn">ରଙ୍ଗ</button>
            <div class="menu-pop">
              <button type="button" data-theme="amber">ଅମ୍ବର</button>
              <button type="button" data-theme="teal">ଟିଲ୍</button>
              <button type="button" data-theme="ruby">ରୁବି</button>
            </div>
          </div>
          <button type="button" class="ghost sessions-toggle" id="sessionsToggle">ବାର୍ତ୍ତା</button>
        </div>
      </header>

      <section id="screenChat" class="screen chat-layout active">
        <aside class="sessions" id="sessionsPanel">
          <button type="button" class="primary" id="newChatBtn">ନୂଆ ବାର୍ତ୍ତା</button>
          <h2>ପୁରୁଣା ବାର୍ତ୍ତା</h2>
          <div class="session-list" id="sessionList"></div>
          <div class="side-actions">
            <button type="button" class="ghost" id="pdfBtn">ଡକ୍ୟୁମେଣ୍ଟ ଯୋଡ଼ନ୍ତୁ</button>
            <button type="button" class="ghost" id="retrainBtn">ଜ୍ଞାନ ପୁନଃ ସଜାନ୍ତୁ</button>
            <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
          </div>
        </aside>
        <div class="chat-col">
          <div class="messages" id="messages"></div>
          <div class="preview" id="imagePreview" hidden>
            <img id="previewImg" alt="">
            <span id="previewName"></span>
            <button type="button" class="ghost" id="previewClear">ହଟାନ୍ତୁ</button>
          </div>
          <form class="composer" id="composer">
            <button type="button" class="round" id="attachBtn" title="ଚିତ୍ର ଯୋଡ଼ନ୍ତୁ" aria-label="ଚିତ୍ର ଯୋଡ଼ନ୍ତୁ">+</button>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <textarea id="chatInput" rows="1" placeholder="ଓଡ଼ିଆ, ଇଂରାଜୀ କିମ୍ବା ଇଂରାଜୀ ଅକ୍ଷରରେ ଲେଖନ୍ତୁ"></textarea>
            <button type="button" class="round" id="dictateBtn" title="କହି ଲେଖନ୍ତୁ" aria-label="କହି ଲେଖନ୍ତୁ">🎙️</button>
            <button type="button" class="call-btn" id="callBtn">କଲ୍</button>
            <button type="submit" class="round send" id="sendBtn" aria-label="ପଠାନ୍ତୁ">➤</button>
          </form>
        </div>
      </section>

      <section id="screenVoice" class="screen voice-screen">
        <div class="seg" role="group" aria-label="ଭାଷା ମୋଡ୍">
          <button type="button" id="modeOdia" class="active">ଓଡ଼ିଆ</button>
          <button type="button" id="modeAuto">Auto</button>
        </div>
        <div class="voice-picks" id="voicePicks" role="group" aria-label="Voice">
          <button type="button" class="voice-pick" data-speaker="priya">Priya <span>Female</span></button>
          <button type="button" class="voice-pick" data-speaker="ishita">Ishita <span>Female</span></button>
          <button type="button" class="voice-pick" data-speaker="ritu">Ritu <span>Female</span></button>
          <button type="button" class="voice-pick" data-speaker="shubh">Shubh <span>Male</span></button>
          <button type="button" class="voice-pick" data-speaker="ratan">Ratan <span>Male</span></button>
        </div>
        <div class="voice-status" id="voiceStatus">କହିବା ପାଇଁ ମାଇକ୍ ଦବାନ୍ତୁ</div>
        <div class="transcript" id="voiceTranscript" hidden></div>
        <div class="answer" id="voiceAnswer" hidden></div>
        <div class="sources" id="voiceSources" hidden></div>
        <div class="note" id="voiceNote" hidden></div>
        <div class="ledger" id="ledgerCard" hidden>
          <h2 id="ledgerTitle">ଆପଣ କହିଛନ୍ତି</h2>
          <div id="ledgerRows"></div>
          <form id="ledgerEdit" hidden>
            <label>ପାର୍ଟି <input id="editParty"></label>
            <label>ଜିନିଷ <input id="editItem"></label>
            <label>ରାଶି <input id="editAmount" type="number" min="0" step="1"></label>
            <label>ପ୍ରକାର
              <select id="editAction">
                <option>SALE</option><option>PURCHASE</option><option>RECEIVE_CASH</option><option>PAY_CASH</option><option>CREDIT_GIVEN</option>
              </select>
            </label>
            <label>ପେମେଣ୍ଟ
              <select id="editPay">
                <option>CASH</option><option>CREDIT</option><option>ONLINE</option>
              </select>
            </label>
          </form>
          <div class="actions">
            <button type="button" class="primary" id="ledgerSave">ଠିକ୍ ଅଛି</button>
            <button type="button" class="ghost" id="ledgerEditBtn">ବଦଳାନ୍ତୁ</button>
          </div>
        </div>
        <div class="mic-wrap">
          <button type="button" class="mic-main" id="voiceMic" aria-label="କହନ୍ତୁ">🎙️</button>
          <button type="button" class="danger" id="voiceStop" hidden>ବନ୍ଦ କରନ୍ତୁ</button>
        </div>
      </section>

      <section id="screenKhata" class="screen khata-screen">
        <div class="filters" id="khataFilters">
          <button type="button" data-range="today" class="ghost active">ଆଜି</button>
          <button type="button" data-range="week" class="ghost">ଏହି ସପ୍ତାହ</button>
          <button type="button" data-range="all" class="ghost">ସବୁ</button>
        </div>
        <div class="summary" id="khataSummary"></div>
        <button type="button" class="ghost" id="askSummary">ଏହି ହିସାବ ଉତ୍କଳକୁ ବୁଝାଇବାକୁ କୁହନ୍ତୁ</button>
        <div class="khata-grid">
          <form class="panel" id="khataForm">
            <h2>ନୂଆ ଏଣ୍ଟ୍ରି</h2>
            <label>ପାର୍ଟି <input name="party" required placeholder="ରମେଶ"></label>
            <label>ଜିନିଷ <input name="item" placeholder="ଚାଉଳ"></label>
            <label>ରାଶି <input name="amount" type="number" min="1" step="1" required></label>
            <label>ପ୍ରକାର
              <select name="action">
                <option value="SALE">ବିକ୍ରି</option>
                <option value="PURCHASE">କ୍ରୟ</option>
                <option value="RECEIVE_CASH">ନଗଦ ଆସିଲା</option>
                <option value="PAY_CASH">ନଗଦ ଦେଲି</option>
                <option value="CREDIT_GIVEN">ଉଧାର</option>
              </select>
            </label>
            <label>ପେମେଣ୍ଟ
              <select name="payment_type">
                <option value="CASH">ନଗଦ</option>
                <option value="CREDIT">ବାକି</option>
                <option value="ONLINE">ଅନଲାଇନ୍</option>
              </select>
            </label>
            <button class="primary" type="submit">ଖାତାରେ ରଖନ୍ତୁ</button>
          </form>
          <div class="panel">
            <h2>ପାର୍ଟି ବାକି</h2>
            <div id="partyList"></div>
            <h2>ଏଣ୍ଟ୍ରି</h2>
            <div class="entry-list" id="entryList"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="ମୁଖ୍ୟ ବିଭାଗ">
    <button type="button" data-screen="chat" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg>
      ଚାଟ୍
    </button>
    <button type="button" data-screen="voice">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>
      ଭଏସ୍
    </button>
    <button type="button" data-screen="khata">
      <svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v16l-4-2-4 2-4-2-4 2V5a2 2 0 0 1 2-2z"/></svg>
      ଖାତା
    </button>
  </nav>
  <div class="toast" id="toast" role="status"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mic-wav.js"></script>
  <script src="/js/realtime-voice.js"></script>
  <script src="/js/khata.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/voice-tab.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
